version: '3.8'

services:
  hanacloud-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000" # Changed host port to 3001 to bypass the stuck container
    # Workaround for Coolify bug: Initialize an empty array
    volumes: []
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://192.168.56.101:8080/api}
    depends_on:
      - backend

  backend:
    build:
      context: ./backend # Make sure your Django code is in a folder named 'backend'
    ports:
      - "8080:8000" # Changed host port to 8080 because Coolify dashboard uses 8000
    # Workaround for Coolify bug: Initialize an empty array so the UI can 'push' your storage mapping
    volumes: []
    environment:
      - POSTGRES_DB=hanacloud
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db

  db:
    build:
      context: .
      dockerfile: db.Dockerfile
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: